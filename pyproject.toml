[project]
name = "cc-cost"
version = "0.2.0"
description = "Cost reports for Claude Code and Codex sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Chong" }]
dependencies = []

[project.scripts]
cc-cost = "cc_cost.cli:main"

[dependency-groups]
dev = [
    "pyrefly>=0.37.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/cc_cost/interactive_report.py" = ["E501"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
